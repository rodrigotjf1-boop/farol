name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (node + postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Postgres de verdade, com pgvector, porque SQL em string não se
    # confere lendo. O join desta API atravessa quatro tabelas e a coluna
    # que eu supus que existia não existia — foi o banco que disse.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://farol:farol@localhost:5432/farol

    steps:
      - uses: actions/checkout@v4
      # Versão EXATA (boletim do Node de 21/10/2026: Brotli e eMudhra): "22" pegaria a que estiver guardada no
      # executor. A mesma das imagens (api/Dockerfile e web/Dockerfile).
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: test "$(node -v)" = "v22.23.4" && node -v
      - run: npm ci
      - run: npm run build

      # Aplica as migrations pelo MESMO runner que roda em produção. Assim
      # o caminho de migration é exercitado a cada push, em vez de só na
      # hora do deploy.
      - run: npm run migrar

      - run: npm test

  web:
    name: web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(node -v)" = "v22.23.4" && node -v
      - run: npm ci
      # `next build` ja roda o TypeScript e o lint: build verde significa
      # tipos certos e nenhuma pagina quebrada.
      - run: npm run build

  agente:
    name: agente (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      # Decodificador Brotli no Python (boletim de 21/10/2026): o agente não pede `Brotli` nem `brotlicffi`; com um
      # deles instalado, httpx e urllib3 passariam a pedir e descompactar respostas `br`. Diz se algum entrou.
      - run: pip list 2>/dev/null | grep -i -E "^(brotli|brotlicffi) " || echo "sem Brotli e sem brotlicffi no ambiente do agente"
      - run: python -m pytest

  imagem:
    name: imagem docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O contexto é a RAIZ do repo de propósito: a imagem leva
      # database/migrations junto. Construir aqui pega quebra de Dockerfile
      # antes do deploy, não depois — o EasyPanel faz auto-deploy da main.
      - run: docker build -f api/Dockerfile -t farol-api:ci .
      - run: docker build -f web/Dockerfile -t farol-web:ci .
      # O Node de DENTRO das imagens, as mesmas que o deploy monta: exige a versão exata (boletim de 21/10/2026) e diz
      # se a biblioteca Brotli do sistema está nelas (o Dockerfile não instala pacote nenhum).
      - name: node -v das imagens (exige v22.23.4)
        run: |
          for imagem in farol-api:ci farol-web:ci; do
            versao="$(docker run --rm "$imagem" node -v)"
            echo "$imagem: $versao"
            test "$versao" = "v22.23.4"
            docker run --rm "$imagem" sh -c 'apk info -e brotli-libs || echo "sem brotli-libs"'
          done
