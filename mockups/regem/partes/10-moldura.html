<div class="proto">

    <h2>Controles do protótipo</h2>
    <div class="campo"><span class="rotulo">Situação da conexão</span><div class="seg" id="proto-situacao" role="group" aria-label="Situação da conexão">
      <button type="button" data-v="nao" aria-pressed="false">sem conexão</button>
      <button type="button" data-v="voltou" aria-pressed="false">voltou do Regem</button>
      <button type="button" data-v="conectado" aria-pressed="true">conectado</button>
      <button type="button" data-v="semfichas" aria-pressed="false">Regem sem fichas</button>
      <button type="button" data-v="problema" aria-pressed="false">leitura parada</button>
      <button type="button" data-v="revogado" aria-pressed="false">acesso tirado no Regem</button>
      <button type="button" data-v="carregando" aria-pressed="false">carregando</button>
      <button type="button" data-v="erro" aria-pressed="false">sem resposta</button>
    </div></div>
    <div class="campo"><span class="rotulo">Quem olha</span><div class="seg" id="proto-perfil" role="group" aria-label="Quem olha">
      <button type="button" data-v="diretoria" aria-pressed="true">diretoria</button>
      <button type="button" data-v="gerente" aria-pressed="false">gerente</button>
    </div></div>
    <div class="campo"><span class="rotulo">Tema</span><div class="seg" id="proto-tema" role="group" aria-label="Tema">
      <button type="button" data-v="" aria-pressed="true">do aparelho</button>
      <button type="button" data-v="dark" aria-pressed="false">escuro</button>
      <button type="button" data-v="light" aria-pressed="false">claro</button>
    </div></div>
    <p class="nota">Os dados são de exemplo. “Conectar ao Regem” leva, de verdade, à página de autorização do Regem; aqui o protótipo simula a volta.</p>
  </div>
  <button class="btn mini" type="button" id="proto-abrir" aria-expanded="false" aria-controls="proto-painel"><svg class="ic p" aria-hidden="true"><use href="#i-ajustes"/></svg>Protótipo</button>
