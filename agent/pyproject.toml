[project]
name = "farol-agent"
version = "0.1.0"
description = "Agente do Farol — captura, recorta e julga na loja"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # Juiz de nuvem. MIT. O agente roda sem ele em modo simulado — a
    # importação é tardia de propósito — mas julgar na nuvem exige.
    "anthropic>=0.40",
]

[project.scripts]
farol-agent = "farol_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farol_agent*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
addopts = "-q"
