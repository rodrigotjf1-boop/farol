[project]
name = "farol-agent"
version = "0.1.0"
description = "Agente do Farol — captura, recorta e julga na loja"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
farol-agent = "farol_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farol_agent*"]
